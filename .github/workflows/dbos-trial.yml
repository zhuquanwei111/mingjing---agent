name: DBOS interrupted tool round
on:
  pull_request:
    branches: [lab/architecture-20261123-compare]
    paths: ['lab/dbos/**', '.github/workflows/dbos-trial.yml']
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: make check
      - name: Run real DBOS, two PG instances and independent receiver
        env:
          LAB_OUT: ${{ runner.temp }}/dbos-out
          TEST_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_RUN: ${{ github.run_id }}
        run: bash lab/dbos/run.sh
      - name: Summarize captured evidence
        if: always()
        run: |
          python3 - <<'PY2'
          import base64,gzip,hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'dbos-out')
          for f in sorted(p.glob('*')):
              if f.name.endswith('.log'):
                  print('WORKER_LOG',f.name,'\n'.join(f.read_text().splitlines()[-12:]))
              if f.suffix in {'.json','.txt'}:
                  raw=f.read_bytes()
                  print('DBOS_RAW',f.name,hashlib.sha256(raw).hexdigest(),base64.b64encode(gzip.compress(raw,mtime=0)).decode())
          PY2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dbos-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dbos-out
          if-no-files-found: error

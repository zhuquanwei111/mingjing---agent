name: RB03 RB04 isolated receipt loss
on:
  pull_request:
    branches: [lab/architecture-20261123-compare]
    paths:
      - 'lab/rb34/**'
      - '!lab/rb34/evidence/**'
      - '.github/workflows/rb34.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Repository checks
        run: make check
      - name: Run real receipts and durable re-entry
        env:
          TEST_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_RUN: ${{ github.run_id }}
          RB34_OUT: ${{ runner.temp }}/rb34
        run: bash lab/rb34/run.sh
      - name: Preserve raw observations and histories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rb34-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rb34/
          if-no-files-found: error
